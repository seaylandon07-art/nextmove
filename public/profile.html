<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Player profile · NextMove</title><link rel="icon" type="image/svg+xml" href="/icons/logo.svg"><meta name="description" content="A chess player's profile on NextMove: level, ratings, awards and recent games.">
<style>
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-sans.woff2) format('woff2');font-weight:400 700;font-stretch:75% 100%;font-display:swap}
:root{color-scheme:dark;--bg:#080b17;--panel:#0f1428;--line:rgba(160,176,236,.12);--ink:#eceefb;--mute:#8990b0;--gold:#f1cf86;--gold2:#e2b35e;--ok:#7fd69a;--bad:#ff8b7a}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Instrument Sans',system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#18214a 0%,transparent 60%),var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--gold)}.top{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:16px 20px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none}.brand img{width:32px;height:32px;border-radius:9px}
.top .play{margin-left:auto}
main{max-width:960px;margin:0 auto;padding:0 20px 60px}
.card{border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:16px}
.ban{height:170px;background:var(--ban);position:relative}.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,20,40,0) 25%,#0f1428)}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:end;padding:0 24px 22px;margin-top:-62px;position:relative}
.av{position:relative;width:112px;height:112px;border-radius:30px;background:radial-gradient(circle at 50% 35%,#2b3670,#141a38);box-shadow:inset 0 0 0 2px rgba(241,207,134,.55),0 14px 30px -12px rgba(0,0,0,.8);display:grid;place-items:center;font-size:58px}
.av img{width:84px;height:84px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}.av em{position:absolute;right:-8px;bottom:-8px;min-width:38px;height:38px;padding:0 8px;border-radius:12px;background:var(--gold);color:#1a1305;font-weight:800;font-size:17px;line-height:38px;font-style:normal;text-align:center;box-shadow:0 0 0 4px #0f1428}
h1{margin:0;font-size:30px;letter-spacing:-.02em}.badge{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#1a1305;background:linear-gradient(180deg,#f6dc9e,var(--gold2))}
.meta{color:var(--mute);font-size:14px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px}.btn.gold{background:linear-gradient(180deg,#f6dc9e,var(--gold2));color:#1a1305}.btn.ghost{background:rgba(150,166,232,.1)}.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.btn[disabled]{opacity:.5;pointer-events:none}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.num{padding:16px 18px;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}.num small{display:block;color:var(--mute);font-size:13px}.num b{display:block;font-size:30px;font-weight:700;font-stretch:80%;font-variant-numeric:tabular-nums}.num span{font-size:12.5px;color:var(--mute)}
.ch{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.aws{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:16px}
.aw{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;padding:9px 11px;border-radius:14px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--tc) 14%,transparent),transparent 60%),rgba(150,166,232,.05);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 35%,transparent)}
.aw i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:22px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--tc) 55%,#1a2040),#141a38);box-shadow:inset 0 0 0 2px var(--tc)}.aw b{font-size:14px}.aw small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.g{display:grid;grid-template-columns:90px minmax(0,1fr) 70px;gap:12px;padding:10px 18px;border-top:1px solid var(--line);font-size:14px}.g:first-child{border-top:0}.g time{color:var(--mute)}.g .r{text-align:right;font-weight:700}.w{color:var(--ok)}.l{color:var(--bad)}.d{color:var(--mute)}
.empty{padding:26px 18px;text-align:center;color:var(--mute)}
.gate{text-align:center;margin:14vh auto;max-width:420px}
@media(max-width:700px){.head{grid-template-columns:auto minmax(0,1fr);padding:0 16px 18px}.acts{grid-column:1/-1}.av{width:88px;height:88px;border-radius:24px;font-size:44px}.av img{width:64px;height:64px}h1{font-size:24px}.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.g{grid-template-columns:70px minmax(0,1fr) 54px;padding:10px 14px}}
</style></head><body>
<header class="top"><a class="brand" href="/"><img src="/icons/icon-192.png" alt="">NextMove</a><a class="btn gold play" href="/">Play on NextMove</a></header>
<main id="main"><div class="empty">Loading profile…</div></main>
<script>
const AW = {"first_game": {"n": "First game", "d": "Finish a game", "p": "p", "t": 1}, "first_win": {"n": "First win", "d": "Win a game", "p": "n", "t": 1}, "games_10": {"n": "Regular", "d": "Finish 10 games", "p": "b", "t": 1}, "games_50": {"n": "Committed", "d": "Finish 50 games", "p": "r", "t": 2}, "games_100": {"n": "Centurion", "d": "Finish 100 games", "p": "q", "t": 3}, "beat_theo": {"n": "Beat Theo", "d": "Win against Theo (850)", "p": "n", "t": 1}, "beat_nora": {"n": "Beat Nora", "d": "Win against Nora (1050)", "p": "b", "t": 1}, "beat_victor": {"n": "Beat Victor", "d": "Win against Victor (1350)", "p": "r", "t": 2}, "beat_iris": {"n": "Beat Iris", "d": "Win against Iris (1550)", "p": "q", "t": 2}, "beat_dmitri": {"n": "Beat Dmitri", "d": "Win against Dmitri (1800)", "p": "q", "t": 3}, "beat_sofia": {"n": "Beat Sofia", "d": "Win against Sofia (2100)", "p": "k", "t": 3}, "beat_sf": {"n": "Stockfish slayer", "d": "Beat full-strength Stockfish", "p": "k", "t": 3}, "acc_80": {"n": "Clean game", "d": "Score 80+ accuracy in a reviewed game", "p": "b", "t": 1}, "acc_90": {"n": "Sharp", "d": "Score 90+ accuracy in a reviewed game", "p": "q", "t": 2}, "review_1": {"n": "Self-aware", "d": "Review one of your games", "p": "p", "t": 1}, "review_25": {"n": "Student of the game", "d": "Review 25 games", "p": "r", "t": 2}, "puz_50": {"n": "Puzzler", "d": "Try 50 puzzles", "p": "n", "t": 1}, "puz_250": {"n": "Tactician", "d": "Try 250 puzzles", "p": "q", "t": 2}, "puz_1200": {"n": "1200 club", "d": "Reach a 1200 puzzle rating", "p": "b", "t": 1}, "puz_1500": {"n": "1500 club", "d": "Reach a 1500 puzzle rating", "p": "r", "t": 2}, "puz_1800": {"n": "1800 club", "d": "Reach an 1800 puzzle rating", "p": "k", "t": 3}, "rush_20": {"n": "Rush hour", "d": "Score 20 in Puzzle Rush", "p": "n", "t": 2}, "drill_10": {"n": "Fixed it", "d": "Master 10 mistake drills", "p": "b", "t": 1}, "drill_50": {"n": "Never again", "d": "Master 50 mistake drills", "p": "q", "t": 3}, "course_1": {"n": "Booked up", "d": "Finish an opening line", "p": "p", "t": 1}, "course_10": {"n": "Repertoire", "d": "Finish 10 opening lines", "p": "r", "t": 2}, "streak_7": {"n": "Week streak", "d": "Train 7 days in a row", "p": "n", "t": 2}, "streak_30": {"n": "Month streak", "d": "Train 30 days in a row", "p": "k", "t": 3}, "share": {"n": "Show-off", "d": "Share a game or review", "p": "p", "t": 1}, "import": {"n": "Moving in", "d": "Import your games from chess.com or Lichess", "p": "n", "t": 1}, "install": {"n": "Home screen", "d": "Install the NextMove app", "p": "b", "t": 1}, "founder": {"n": "Founder", "d": "One of the first 500 NextMove Plus members", "p": "k", "t": 3}}, BN = {"midnight": "linear-gradient(135deg,#1a2350,#0a0e1c 70%)", "board": "repeating-conic-gradient(#1c2550 0 25%,#121937 0 50%) 0 0/44px 44px", "gold": "url('/bg/gold.jpg') center/cover", "marble": "url('/bg/marble.jpg') center/cover", "royal": "url('/bg/royal.jpg') center/cover", "tournament": "url('/bg/tournament.jpg') center/cover", "neon": "url('/bg/neon.svg') center/cover", "bishop": "url('/bg/bishop.jpg') center/cover", "arena": "url('/bg/arena.jpg') center/cover", "sunrise": "url('/bg/sunrise.jpg') center/cover", "ice": "url('/bg/ice.jpg') center/cover", "checkmate": "url('/bg/checkmate.jpg') center/cover", "plusgold": "radial-gradient(120% 140% at 85% 0%,#f6dc9e 0%,#c8923e 28%,#3a2a12 62%,#120d06 100%)", "plusice": "url('/bg/ice.jpg') center/cover", "founder": "linear-gradient(120deg,#0a0e1c 0%,#2a1f0a 40%,#f1cf86 50%,#2a1f0a 60%,#0a0e1c 100%)"};
const TIER = ['', '#d39a6a', '#cfd7ec', '#f1cf86'], PC = { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕', k: '♔' };
const TITLES = [[1, 'Pawn', 'p'], [5, 'Knight', 'n'], [10, 'Bishop', 'b'], [15, 'Rook', 'r'], [22, 'Queen', 'q'], [30, 'King', 'k'], [40, 'Grandmaster', 'k']];
const need = L => 100 + (L - 1) * 50; const lvl = t => { let L = 1, b = 0; while (t >= b + need(L)) { b += need(L); L++; } return L; };
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
const name = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
let token = null; try { token = localStorage.getItem('nm-token'); } catch (e) { }
(async () => {
  const r = await fetch('/api/u/' + encodeURIComponent(name)); const p = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('main').innerHTML = `<div class="gate"><h1>No player called ${esc(name)}</h1><p class="meta">Check the spelling, or find them in your friends list.</p><a class="btn gold" href="/">Go to NextMove</a></div>`; return; }
  document.title = `${p.username} · NextMove`;
  if (p.private) { document.getElementById('main').innerHTML = `<div class="gate"><h1>${esc(p.username)}</h1><p class="meta">This profile is private.</p><a class="btn gold" href="/">Go to NextMove</a></div>`; return; }
  const L = lvl(p.xp), T = TITLES.filter(t => L >= t[0]).pop();
  const res = g => { if (!g.me) return ['', 'd']; if (g.result === '1/2-1/2') return ['Draw', 'd']; const w = (g.result === '1-0') === (g.me === 'w'); return [w ? 'Won' : 'Lost', w ? 'w' : 'l']; };
  const mine = token ? await fetch('/api/me', { headers: { authorization: 'Bearer ' + token } }).then(x => x.ok ? x.json() : null).catch(() => null) : null;
  const self = mine && mine.user && mine.user.username.toLowerCase() === p.username.toLowerCase();
  document.getElementById('main').innerHTML = `<div class="card" style="--ban:${esc(BN[p.banner] || BN.midnight)}"><div class="ban"></div><div class="head">
      <div class="av">${PC[T[2]]}<em>${L}</em></div>
      <div><h1>${esc(p.username)}${p.plus ? '<span class="badge">Plus</span>' : ''}${p.founder ? '<span class="badge">Founder</span>' : ''}</h1><div class="meta">${T[1]} · level ${L} · joined ${new Date(p.created).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div></div>
      <div class="acts">${self ? '<a class="btn ghost" href="/#progress">Edit profile</a>' : `<button class="btn gold" id="addF">${token ? 'Add friend' : 'Sign in to add friend'}</button>`}<button class="btn ghost" id="share">Share</button></div></div></div>
    <div class="nums"><div class="num"><small>Play rating</small><b>${p.elo ?? '–'}</b><span>vs bots and online</span></div><div class="num"><small>Puzzle rating</small><b>${p.puzzle ?? '–'}</b><span>${p.best.rush ? `rush best ${p.best.rush}` : '&nbsp;'}</span></div><div class="num"><small>Games</small><b>${p.games}</b><span>${p.won} won · ${p.draws} drawn · ${p.lost} lost</span></div><div class="num"><small>Awards</small><b>${p.awards.length}</b><span>of ${Object.keys(AW).length}</span></div></div>
    <div class="card"><div class="ch">Awards</div>${p.awards.length ? `<div class="aws">${p.awards.filter(a => AW[a]).map(a => `<div class="aw" style="--tc:${TIER[AW[a].t]}"><i>${PC[AW[a].p]}</i><span><b>${esc(AW[a].n)}</b><small>${esc(AW[a].d)}</small></span></div>`).join('')}</div>` : '<div class="empty">No awards yet.</div>'}</div>
    <div class="card"><div class="ch">Recent games</div>${p.recent.length ? p.recent.map(g => { const [t, c] = res(g); return `<div class="g"><time>${esc((g.date || '').slice(5))}</time><span>${esc(g.white)} vs ${esc(g.black)}</span><span class="r ${c}">${t || esc(g.result)}</span></div>`; }).join('') : '<div class="empty">No finished games yet.</div>'}</div>`;
  document.getElementById('share').onclick = () => { const url = location.href; navigator.share ? navigator.share({ title: `${p.username} on NextMove`, url }).catch(() => { }) : navigator.clipboard.writeText(url).then(() => alertish('Link copied')); };
  const add = document.getElementById('addF');
  if (add) add.onclick = async () => { if (!token) { location.href = '/'; return; } add.disabled = true; const x = await fetch('/api/friends', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ username: p.username }) }); const d = await x.json().catch(() => ({})); add.textContent = x.ok ? (d.status === 'friends' ? 'Friends' : 'Request sent') : (d.error || 'Try again'); };
})();
function alertish(m) { const b = document.getElementById('share'); const t = b.textContent; b.textContent = m; setTimeout(() => b.textContent = t, 1600); }
</script></body></html>

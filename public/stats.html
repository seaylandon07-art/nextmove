<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · NextMove</title><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
<style>
:root{color-scheme:dark}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#0a0e1c;color:#eceefb}main{max-width:980px;margin:0 auto;padding:32px 18px 60px}
h1{font-size:30px;margin:0}a{color:#f1cf86}.mute{color:#8990b0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.t{padding:14px 16px;border-radius:16px;background:rgba(150,166,232,.07);box-shadow:inset 0 0 0 1px rgba(160,176,236,.12)}.t small{color:#8990b0;display:block}.t b{font-size:30px;font-variant-numeric:tabular-nums}.t span{font-size:12.5px;color:#8990b0}
.chart{padding:16px;border-radius:16px;background:rgba(150,166,232,.05);box-shadow:inset 0 0 0 1px rgba(160,176,236,.12);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}th,td{text-align:right;padding:6px 8px;border-bottom:1px solid rgba(160,176,236,.08)}th:first-child,td:first-child{text-align:left;white-space:nowrap}th{color:#8990b0;font-weight:600}
select{background:#121933;color:#eceefb;border:1px solid rgba(160,176,236,.2);border-radius:10px;padding:6px 10px}
button.ab{background:#1a2246;color:#eceefb;border:1px solid rgba(160,176,236,.2);border-radius:9px;padding:5px 9px;font:inherit;font-size:12.5px;cursor:pointer;margin:2px}button.ab.gold{background:#f1cf86;color:#1a1305;border:0}button.ab.red{color:#ff8b7a}.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:700}.tag.p{background:#f1cf86;color:#1a1305}.tag.f{background:rgba(160,176,236,.15)}.tag.a{background:#7fd69a;color:#06210f}
</style></head><body><main>
<p><a href="/">← Back to NextMove</a></p>
<h1>Admin</h1><p class="mute" id="note">Loading…</p>
<div class="tiles" id="tiles"></div>
<div class="chart"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Daily</b><select id="metric"></select></div><svg id="svg" width="100%" height="200"></svg></div>
<div class="chart"><table id="tbl"></table></div>
<div class="chart"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><b>Accounts</b><input id="uq" placeholder="Search usernames" style="background:#121933;color:#eceefb;border:1px solid rgba(160,176,236,.2);border-radius:10px;padding:7px 10px"></div><div style="overflow:auto"><table id="users"></table></div><p class="mute" id="umsg"></p></div>
<div class="chart"><b>Recent errors</b><p class="mute" id="errNone">None reported. Nice.</p><table id="errs"></table></div>
<script>
const LABEL = { visit: 'Visits', signup: 'Sign-ups', plus_view: 'Plus sheet views', plus_buy: 'Plus purchases', game_bot: 'Games vs bots', game_online: 'Online games', game_local: 'Pass & play games', review: 'Reviews', import: 'Game imports', puzzle: 'Puzzles', drill: 'Drills', course: 'Opening lines', share: 'Shares', install: 'App installs' };
(async () => {
  let token = null; try { token = localStorage.getItem('nm-token'); } catch (e) { }
  const r = await fetch('/api/stats', { headers: token ? { authorization: 'Bearer ' + token } : {} }); const d = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('note').textContent = r.status === 401 ? 'Sign in on NextMove first, then reload this page.' : 'This page is only for the site owner.'; return; }
  const days = []; for (let i = 29; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toISOString().slice(0, 10));
  const by = {}; for (const { day, k, n } of d.rows) { (by[k] = by[k] || {})[day] = n; }
  const sum = (k, from) => days.slice(from).reduce((a, x) => a + ((by[k] || {})[x] || 0), 0);
  document.getElementById('note').textContent = `${d.users} accounts in total · ${d.plus || 0} paying for Plus · ${d.comp || 0} with free Plus · last 30 days below · counts are cookieless daily totals`;
  document.getElementById('tiles').innerHTML = Object.keys(LABEL).map(k => `<div class="t"><small>${LABEL[k]}</small><b>${sum(k, 0)}</b><span>${sum(k, 23)} this week · ${(by[k] || {})[days[29]] || 0} today</span></div>`).join('');
  const sel = document.getElementById('metric'); sel.innerHTML = Object.keys(LABEL).map(k => `<option value="${k}">${LABEL[k]}</option>`).join('');
  const draw = () => {
    const k = sel.value, vals = days.map(x => (by[k] || {})[x] || 0), max = Math.max(1, ...vals), svg = document.getElementById('svg'), W = svg.clientWidth, H = 200, bw = W / days.length;
    svg.innerHTML = vals.map((v, i) => `<rect x="${i * bw + 2}" y="${H - 22 - (H - 40) * v / max}" width="${bw - 4}" height="${(H - 40) * v / max}" rx="4" fill="#f1cf86" opacity="${i === days.length - 1 ? 1 : .75}"><title>${days[i]}: ${v}</title></rect>`).join('') +
      days.map((x, i) => i % 5 === 4 ? `<text x="${i * bw + bw / 2}" y="${H - 4}" fill="#8990b0" font-size="11" text-anchor="middle">${x.slice(5)}</text>` : '').join('') + `<text x="0" y="12" fill="#8990b0" font-size="11">max ${max}</text>`;
  };
  sel.onchange = draw; draw(); addEventListener('resize', draw);
  if (d.errors && d.errors.length) { document.getElementById('errNone').hidden = true; const e = s => String(s || '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]);
    document.getElementById('errs').innerHTML = '<tr><th>When</th><th style="text-align:left">Error</th><th style="text-align:left">Where</th></tr>' + d.errors.map(x => `<tr><td>${new Date(x.t).toLocaleString()}</td><td style="text-align:left">${e(x.msg)}</td><td style="text-align:left">${e(x.src)} ${e(x.path)}</td></tr>`).join(''); }
  // accounts
  const H = { authorization: 'Bearer ' + token, 'content-type': 'application/json' }; const esc2 = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
  const ago = t => { if (!t) return '–'; const d = Math.round((Date.now() - t) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
  let US = [];
  async function loadUsers() { const r = await fetch('/api/admin/users', { headers: H }); const j = await r.json(); US = j.users || []; drawUsers(); }
  function drawUsers() {
    const q = (document.getElementById('uq').value || '').toLowerCase();
    const rows = US.filter(u => u.username.toLowerCase().includes(q));
    document.getElementById('users').innerHTML = '<tr><th>User</th><th>Joined</th><th>Last save</th><th>Plan</th><th style="text-align:left">Actions</th></tr>' + rows.map(u => `<tr><td>${esc2(u.username)} ${u.admin ? '<span class="tag a">admin</span>' : ''}${u.founder ? ' <span class="tag p">founder</span>' : ''}<br><span class="mute" style="font-size:12px">${esc2(u.email || '')}</span></td><td>${new Date(u.created).toLocaleDateString()}</td><td>${ago(u.last_save)}</td>
      <td>${u.plus ? `<span class="tag p">Plus</span> <span class="mute" style="font-size:12px">${u.admin ? 'admin' : u.comp ? 'free' : 'paid'}</span>` : '<span class="tag f">Free</span>'}</td>
      <td style="text-align:left">${u.admin ? '' : u.comp ? `<button class="ab" data-a="uncomp" data-u="${esc2(u.username)}">Remove free Plus</button>` : `<button class="ab gold" data-a="comp" data-u="${esc2(u.username)}">Give free Plus</button>`}<button class="ab" data-a="signout" data-u="${esc2(u.username)}">Sign out everywhere</button><button class="ab" data-a="recovery" data-u="${esc2(u.username)}">New recovery code</button>${u.admin ? '' : `<button class="ab red" data-a="delete" data-u="${esc2(u.username)}">Delete</button>`}</td></tr>`).join('');
    document.getElementById('umsg').textContent = `${rows.length} of ${US.length} accounts`;
  }
  document.getElementById('uq').oninput = drawUsers;
  document.getElementById('users').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, u = b.dataset.u; const body = { username: u, action: a };
    if (a === 'delete') { const c = prompt(`This permanently deletes ${u} and all their games and progress. Type the username to confirm:`); if (c !== u) return; body.confirm = c; }
    if (a === 'signout' && !confirm(`Sign ${u} out on every device?`)) return;
    b.disabled = true; const r = await fetch('/api/admin/user', { method: 'POST', headers: H, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || 'That didn’t work.'); b.disabled = false; return; }
    if (j.recoveryCode) prompt(`New recovery code for ${u}. Send it to them privately; their old code no longer works:`, j.recoveryCode);
    loadUsers();
  };
  loadUsers();
  const keys = Object.keys(LABEL);
  document.getElementById('tbl').innerHTML = `<tr><th>Day</th>${keys.map(k => `<th>${LABEL[k]}</th>`).join('')}</tr>` + days.slice().reverse().map(x => `<tr><td>${x}</td>${keys.map(k => `<td>${(by[k] || {})[x] || ''}</td>`).join('')}</tr>`).join('');
})();
</script></main></body></html>

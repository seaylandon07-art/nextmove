<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Site stats · NextMove</title><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
<style>
:root{color-scheme:dark}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#0a0e1c;color:#eceefb}main{max-width:980px;margin:0 auto;padding:32px 18px 60px}
h1{font-size:30px;margin:0}a{color:#f1cf86}.mute{color:#8990b0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.t{padding:14px 16px;border-radius:16px;background:rgba(150,166,232,.07);box-shadow:inset 0 0 0 1px rgba(160,176,236,.12)}.t small{color:#8990b0;display:block}.t b{font-size:30px;font-variant-numeric:tabular-nums}.t span{font-size:12.5px;color:#8990b0}
.chart{padding:16px;border-radius:16px;background:rgba(150,166,232,.05);box-shadow:inset 0 0 0 1px rgba(160,176,236,.12);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}th,td{text-align:right;padding:6px 8px;border-bottom:1px solid rgba(160,176,236,.08)}th:first-child,td:first-child{text-align:left}th{color:#8990b0;font-weight:600}
select{background:#121933;color:#eceefb;border:1px solid rgba(160,176,236,.2);border-radius:10px;padding:6px 10px}
</style></head><body><main>
<p><a href="/">← Back to NextMove</a></p>
<h1>Site stats</h1><p class="mute" id="note">Loading…</p>
<div class="tiles" id="tiles"></div>
<div class="chart"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Daily</b><select id="metric"></select></div><svg id="svg" width="100%" height="200"></svg></div>
<div class="chart"><table id="tbl"></table></div>
<script>
const LABEL = { visit: 'Visits', signup: 'Sign-ups', game_bot: 'Games vs bots', game_online: 'Online games', game_local: 'Pass & play games', review: 'Reviews', import: 'Game imports', puzzle: 'Puzzles', drill: 'Drills', course: 'Opening lines', share: 'Shares', install: 'App installs' };
(async () => {
  let token = null; try { token = localStorage.getItem('nm-token'); } catch (e) { }
  const r = await fetch('/api/stats', { headers: token ? { authorization: 'Bearer ' + token } : {} }); const d = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('note').textContent = r.status === 401 ? 'Sign in on NextMove first, then reload this page.' : 'This page is only for the site owner.'; return; }
  const days = []; for (let i = 29; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toISOString().slice(0, 10));
  const by = {}; for (const { day, k, n } of d.rows) { (by[k] = by[k] || {})[day] = n; }
  const sum = (k, from) => days.slice(from).reduce((a, x) => a + ((by[k] || {})[x] || 0), 0);
  document.getElementById('note').textContent = `${d.users} accounts in total · last 30 days below · counts are cookieless daily totals`;
  document.getElementById('tiles').innerHTML = Object.keys(LABEL).map(k => `<div class="t"><small>${LABEL[k]}</small><b>${sum(k, 0)}</b><span>${sum(k, 23)} this week · ${(by[k] || {})[days[29]] || 0} today</span></div>`).join('');
  const sel = document.getElementById('metric'); sel.innerHTML = Object.keys(LABEL).map(k => `<option value="${k}">${LABEL[k]}</option>`).join('');
  const draw = () => {
    const k = sel.value, vals = days.map(x => (by[k] || {})[x] || 0), max = Math.max(1, ...vals), svg = document.getElementById('svg'), W = svg.clientWidth, H = 200, bw = W / days.length;
    svg.innerHTML = vals.map((v, i) => `<rect x="${i * bw + 2}" y="${H - 22 - (H - 40) * v / max}" width="${bw - 4}" height="${(H - 40) * v / max}" rx="4" fill="#f1cf86" opacity="${i === days.length - 1 ? 1 : .75}"><title>${days[i]}: ${v}</title></rect>`).join('') +
      days.map((x, i) => i % 5 === 4 ? `<text x="${i * bw + bw / 2}" y="${H - 4}" fill="#8990b0" font-size="11" text-anchor="middle">${x.slice(5)}</text>` : '').join('') + `<text x="0" y="12" fill="#8990b0" font-size="11">max ${max}</text>`;
  };
  sel.onchange = draw; draw(); addEventListener('resize', draw);
  const keys = Object.keys(LABEL);
  document.getElementById('tbl').innerHTML = `<tr><th>Day</th>${keys.map(k => `<th>${LABEL[k]}</th>`).join('')}</tr>` + days.slice().reverse().map(x => `<tr><td>${x}</td>${keys.map(k => `<td>${(by[k] || {})[x] || ''}</td>`).join('')}</tr>`).join('');
})();
</script></main></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · NextMove</title><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
<style>
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-sans.woff2) format('woff2');font-weight:400 700;font-stretch:75% 100%;font-display:swap}
:root{color-scheme:dark;--bg:#080b17;--panel:#0f1428;--panel2:#141b36;--line:rgba(160,176,236,.12);--ink:#eceefb;--mute:#8990b0;--gold:#f1cf86;--gold2:#e2b35e;--ok:#7fd69a;--bad:#ff8b7a;--r:18px}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 'Instrument Sans',system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#18214a 0%,transparent 60%),var(--bg);color:var(--ink);min-height:100vh}
button,input{font:inherit;color:inherit}a{color:var(--gold)}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:rgba(8,11,23,.75);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink)}.brand img{width:32px;height:32px;border-radius:9px}
.brand span{color:var(--mute);font-weight:500}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(150,166,232,.07);margin-left:auto}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.dots:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.who{font-size:13px;color:var(--mute)}
main{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 18px;border-radius:var(--r);background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 1px var(--line)}
.kpi small{display:block;color:var(--mute);font-size:13px}.kpi b{display:block;font-size:32px;font-weight:700;font-stretch:80%;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--mute)}.kpi .up{color:var(--ok)}
.card{border-radius:var(--r);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:16px}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}.ch h2{font-size:16px;margin:0;margin-right:auto}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:rgba(150,166,232,.07)}.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}.seg button.on{background:var(--panel2);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(150,166,232,.07);color:var(--mute)}.chip.on{background:rgba(241,207,134,.14);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(241,207,134,.4)}
.chart{position:relative;padding:14px 18px 10px}.chart svg{display:block;width:100%;height:240px;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;padding:6px 10px;border-radius:10px;background:#1b2347;box-shadow:0 10px 24px -8px rgba(0,0,0,.7),inset 0 0 0 1px var(--line);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-120%)}
.bars{padding:12px 18px 16px;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:12px;align-items:center;font-size:14px}.bar div{height:10px;border-radius:10px;background:rgba(150,166,232,.08);overflow:hidden}.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--gold2),var(--gold))}.bar b{text-align:right;font-variant-numeric:tabular-nums}
.search{flex:1 1 220px;max-width:320px;padding:9px 13px;border-radius:12px;border:0;background:rgba(6,9,22,.6);box-shadow:inset 0 0 0 1px var(--line)}.search:focus{outline:none;box-shadow:inset 0 0 0 2px rgba(241,207,134,.6)}
.users{padding:6px 10px 12px}
.u{display:grid;grid-template-columns:40px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 130px 36px;gap:14px;align-items:center;padding:10px 8px;border-radius:14px}
.u:hover{background:rgba(150,166,232,.05)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#2b3670,#18204a);box-shadow:inset 0 0 0 1px var(--line)}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mute);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:13.5px}.cell em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:0 4px 2px 0}
.t-plus{background:linear-gradient(180deg,#f6dc9e,var(--gold2));color:#1a1305}.t-free{background:rgba(150,166,232,.12);color:var(--mute)}.t-admin{background:rgba(127,214,154,.16);color:var(--ok)}.t-founder{background:rgba(241,207,134,.12);color:var(--gold)}
.plan small{display:block;color:var(--mute);font-size:12px}
.menu{position:relative}.dots{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}.dots:hover,.dots[aria-expanded=true]{background:rgba(150,166,232,.1);color:var(--ink)}
.pop{position:absolute;right:0;top:40px;z-index:20;min-width:210px;padding:6px;border-radius:14px;background:#141b38;box-shadow:inset 0 0 0 1px var(--line),0 20px 40px -12px rgba(0,0,0,.85)}
.pop button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:9px 12px;border-radius:9px;font-size:14px}.pop button:hover,.pop button:focus-visible{background:rgba(150,166,232,.1)}.pop .danger{color:var(--bad)}.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.err{padding:12px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;font-size:13.5px}.err:first-child{border-top:0}.err time{color:var(--mute)}.err code{display:block;color:var(--mute);font-size:12px;margin-top:3px;word-break:break-all}
.empty{padding:34px 18px;text-align:center;color:var(--mute)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px}
.btn.gold{background:linear-gradient(180deg,#f6dc9e,var(--gold2));color:#1a1305}.btn.ghost{background:rgba(150,166,232,.1)}.btn.red{background:rgba(255,139,122,.15);color:var(--bad)}.btn[disabled]{opacity:.45;pointer-events:none}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(4,6,16,.6);backdrop-filter:blur(8px)}
.dlg{width:100%;max-width:440px;padding:22px;border-radius:22px;background:linear-gradient(180deg,#161d3e,#0f1428);box-shadow:inset 0 0 0 1px var(--line),0 40px 80px -20px rgba(0,0,0,.85)}
.dlg h3{margin:0 0 6px;font-size:19px}.dlg p{color:var(--mute);margin:0 0 14px;font-size:14.5px}.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dlg input{width:100%;padding:10px 13px;border-radius:12px;border:0;background:rgba(6,9,22,.6);box-shadow:inset 0 0 0 1px var(--line)}
.code{font:700 22px/1.2 ui-monospace,monospace;letter-spacing:.06em;text-align:center;padding:14px;border-radius:14px;background:rgba(241,207,134,.08);box-shadow:inset 0 0 0 1px rgba(241,207,134,.3);color:var(--gold)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:12px;background:#1b2347;box-shadow:0 14px 30px -10px rgba(0,0,0,.8),inset 0 0 0 1px var(--line);font-size:14px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(150,166,232,.06),rgba(150,166,232,.14),rgba(150,166,232,.06));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}
.gate{max-width:420px;margin:12vh auto;text-align:center}.gate img{width:64px;height:64px;border-radius:18px;margin-bottom:12px}
@media(max-width:820px){.u{grid-template-columns:40px minmax(0,1fr) auto 36px}.u .hideM{display:none}.bar{grid-template-columns:110px minmax(0,1fr) 44px}.err{grid-template-columns:1fr}.topin{flex-wrap:wrap}.tabs{margin-left:0;order:3;width:100%}.tabs button{flex:1;text-align:center}.who{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="/"><img src="/icons/icon-192.png" alt="">NextMove <span>Admin</span></a>
  <nav class="tabs" id="tabs" hidden><button data-t="overview" class="on">Overview</button><button data-t="accounts">Accounts</button><button data-t="reports">Reports</button><button data-t="errors">Errors</button></nav>
  <span class="who" id="who"></span></div></header>
<main id="main"><div class="kpis"><div class="kpi"><div class="skel" style="width:60%"></div><div class="skel" style="height:28px;margin-top:10px"></div></div><div class="kpi"><div class="skel" style="width:60%"></div><div class="skel" style="height:28px;margin-top:10px"></div></div><div class="kpi"><div class="skel" style="width:60%"></div><div class="skel" style="height:28px;margin-top:10px"></div></div><div class="kpi"><div class="skel" style="width:60%"></div><div class="skel" style="height:28px;margin-top:10px"></div></div></div></main>
<div id="toast" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
const LABEL = { visit: 'Visits', signup: 'Sign-ups', game_bot: 'Games vs bots', game_online: 'Online games', game_local: 'Pass & play', review: 'Reviews', import: 'Imports', puzzle: 'Puzzles', drill: 'Drills', course: 'Opening lines', share: 'Shares', install: 'App installs', plus_view: 'Plus views', plus_buy: 'Plus purchases' };
let token = null; try { token = localStorage.getItem('nm-token'); } catch (e) { }
const H = { authorization: 'Bearer ' + token, 'content-type': 'application/json' };
const api = async (p, o = {}) => { const r = await fetch('/api' + p, { ...o, headers: H }); const d = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(d.error || 'Something went wrong'); e.status = r.status; throw e; } return d; };
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2600); };
const ago = t => { if (!t) return 'never'; const m = (Date.now() - t) / 6e4; if (m < 60) return 'just now'; const h = m / 60; if (h < 24) return Math.round(h) + 'h ago'; const d = h / 24; return d < 2 ? 'yesterday' : Math.round(d) + ' days ago'; };
const day = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const S = { tab: 'overview', range: 30, metric: 'visit', stats: null, users: null, filter: 'all', q: '' };

function modal(html, wire) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m); const close = () => m.remove();
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  wire && wire(m, close); const f = m.querySelector('input, .btn.gold'); f && f.focus(); return m;
}

/* ---------- overview ---------- */
function overview() {
  const d = S.stats; const days = []; for (let i = S.range - 1; i >= 0; i--) days.push(day(new Date(Date.now() - i * 864e5)));
  const by = {}; for (const { day: dd, k, n } of d.rows) (by[k] = by[k] || {})[dd] = n;
  const sum = (k, n = S.range) => days.slice(-n).reduce((a, x) => a + ((by[k] || {})[x] || 0), 0);
  const today = k => (by[k] || {})[days[days.length - 1]] || 0;
  const G = ['game_bot', 'game_online', 'game_local'];
  $('#main').innerHTML = `<h1>Overview</h1><p class="sub">Cookieless daily totals. No personal tracking.</p>
  <div class="kpis">
    <div class="kpi"><small>Accounts</small><b>${d.users}</b><span><span class="up">+${sum('signup', 7)}</span> this week</span></div>
    <div class="kpi"><small>Visits</small><b>${sum('visit', 7)}</b><span>${today('visit')} today · last 7 days</span></div>
    <div class="kpi"><small>Games played</small><b>${G.reduce((a, g) => a + sum(g, 7), 0)}</b><span>${G.reduce((a, g) => a + today(g), 0)} today · last 7 days</span></div>
    <div class="kpi"><small>Reviews</small><b>${sum('review', 7)}</b><span>${today('review')} today · last 7 days</span></div>
    <div class="kpi"><small>Plus</small><b>${d.plus || 0}</b><span>paying · ${d.comp || 0} on free Plus</span></div>
  </div>
  <div class="card"><div class="ch"><h2>${LABEL[S.metric]}</h2><div class="seg" id="rng">${[7, 30, 60].map(r => `<button data-r="${r}" class="${r === S.range ? 'on' : ''}">${r} days</button>`).join('')}</div></div>
    <div class="chips" id="mets">${Object.keys(LABEL).map(k => `<button class="chip${k === S.metric ? ' on' : ''}" data-m="${k}">${LABEL[k]}</button>`).join('')}</div>
    <div class="chart" id="chart"><svg></svg><div class="tip" hidden></div></div></div>
  <div class="card"><div class="ch"><h2>What people did · last ${S.range} days</h2></div><div class="bars" id="bars"></div></div>`;
  const tot = Object.keys(LABEL).map(k => [k, sum(k)]).filter(([, n]) => n).sort((a, b) => b[1] - a[1]); const mx = Math.max(1, ...tot.map(t => t[1]));
  $('#bars').innerHTML = tot.length ? tot.map(([k, n]) => `<div class="bar"><span>${LABEL[k]}</span><div><i style="width:${n / mx * 100}%"></i></div><b>${n.toLocaleString()}</b></div>`).join('') : '<div class="empty">Nothing yet in this range.</div>';
  $('#rng').onclick = e => { const b = e.target.closest('[data-r]'); if (b) { S.range = +b.dataset.r; overview(); } };
  $('#mets').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { S.metric = b.dataset.m; overview(); } };
  // chart: area + line; hover or drag shows the day
  const vals = days.map(x => (by[S.metric] || {})[x] || 0), svg = $('#chart svg'), W = svg.clientWidth || 800, Hh = 240, L = 34, R = 10, T = 14, B = 26;
  const step = Math.max(1, Math.ceil(Math.max(...vals) / 4)), top = step * 4;
  const X = i => L + (vals.length < 2 ? 0 : i / (vals.length - 1) * (W - L - R)), Y = v => T + (1 - v / top) * (Hh - T - B);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  svg.innerHTML = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1cf86" stop-opacity=".28"/><stop offset="1" stop-color="#f1cf86" stop-opacity="0"/></linearGradient></defs>
    ${[0, 1, 2, 3, 4].map(k => `<line x1="${L}" x2="${W - R}" y1="${Y(k * step)}" y2="${Y(k * step)}" stroke="rgba(160,176,236,.1)"/><text x="${L - 8}" y="${Y(k * step) + 4}" fill="#8990b0" font-size="11" text-anchor="end">${k * step}</text>`).join('')}
    <path d="M${pts[0]} L${pts.join(' L')} L${X(vals.length - 1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#ga)"/>
    <path d="M${pts.join(' L')}" fill="none" stroke="#f1cf86" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${days.map((x, i) => i % Math.ceil(days.length / 7) === 0 || i === days.length - 1 ? `<text x="${X(i)}" y="${Hh - 6}" fill="#8990b0" font-size="11" text-anchor="middle">${new Date(x + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>` : '').join('')}
    <circle id="dot" r="4.5" fill="#f1cf86" stroke="#0f1428" stroke-width="2" visibility="hidden"/>`;
  const tip = $('#chart .tip'), dot = svg.querySelector('#dot');
  svg.onpointermove = e => { const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W; const i = Math.max(0, Math.min(vals.length - 1, Math.round((x - L) / (W - L - R) * (vals.length - 1))));
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(vals[i])); dot.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (X(i) / W * r.width + 18) + 'px'; tip.style.top = (Y(vals[i]) / Hh * r.height + 14) + 'px';
    tip.innerHTML = `<b>${vals[i]}</b> ${esc(LABEL[S.metric].toLowerCase())} · ${new Date(days[i] + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}`; };
  svg.onpointerleave = () => { tip.hidden = true; dot.setAttribute('visibility', 'hidden'); };
}

/* ---------- accounts ---------- */
function accounts() {
  $('#main').innerHTML = `<h1>Accounts</h1><p class="sub">Manage players, give free Plus, and help people who are locked out.</p>
  <div class="card"><div class="ch"><h2 id="ucount">Accounts</h2><input class="search" id="uq" type="search" placeholder="Search username or email" value="${esc(S.q)}"></div>
  <div class="chips" id="uf">${[['all', 'All'], ['plus', 'Plus'], ['free', 'Free'], ['admin', 'Admins']].map(([k, n]) => `<button class="chip${S.filter === k ? ' on' : ''}" data-f="${k}">${n}</button>`).join('')}</div>
  <div class="users" id="ul">${S.users ? '' : '<div class="empty">Loading accounts…</div>'}</div></div>`;
  $('#uq').oninput = e => { S.q = e.target.value; drawUsers(); };
  $('#uf').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; S.filter = b.dataset.f; [...$('#uf').children].forEach(x => x.classList.toggle('on', x === b)); drawUsers(); };
  $('#ul').onclick = onUserClick;
  if (S.users) drawUsers(); else loadUsers();
}
async function loadUsers() { try { S.users = (await api('/admin/users')).users; if (S.tab === 'accounts') drawUsers(); } catch (e) { $('#ul').innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
function drawUsers() {
  const q = S.q.trim().toLowerCase();
  const list = S.users.filter(u => (!q || u.username.toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)) && (S.filter === 'all' || (S.filter === 'plus' && u.plus) || (S.filter === 'free' && !u.plus) || (S.filter === 'admin' && u.admin)));
  $('#ucount').textContent = `${list.length} of ${S.users.length} accounts`;
  $('#ul').innerHTML = list.length ? list.map(u => `<div class="u">
      <div class="av">${esc(u.username[0].toUpperCase())}</div>
      <div class="nm"><b>${esc(u.username)}</b><small>${u.email ? esc(u.email) : 'no email saved'}</small></div>
      <div class="cell hideM">${new Date(u.created).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}<em>joined</em></div>
      <div class="cell hideM">${ago(u.last_save)}<em>last active</em></div>
      <div class="plan">${u.admin ? '<span class="tag t-admin">Admin</span>' : ''}${u.plus ? '<span class="tag t-plus">Plus</span>' : '<span class="tag t-free">Free</span>'}${u.founder ? '<span class="tag t-founder">Founder</span>' : ''}<small>${u.admin ? 'full access' : u.comp ? 'free Plus' : u.plus ? 'paid' : ''}</small></div>
      <div class="menu"><button class="dots" data-menu="${esc(u.username)}" aria-label="Actions for ${esc(u.username)}" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
    </div>`).join('') : '<div class="empty">No accounts match.</div>';
}
function closeMenus() { document.querySelectorAll('.pop').forEach(p => p.remove()); document.querySelectorAll('.dots[aria-expanded=true]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });
function onUserClick(e) {
  const m = e.target.closest('[data-menu]'); if (!m) return;
  const open = m.getAttribute('aria-expanded') === 'true'; closeMenus(); if (open) return;
  const u = S.users.find(x => x.username === m.dataset.menu);
  const p = document.createElement('div'); p.className = 'pop';
  p.innerHTML = `${u.admin ? '' : u.comp ? '<button data-a="uncomp">Remove free Plus</button>' : '<button data-a="comp">Give free Plus</button>'}<button data-a="recovery">New recovery code</button><button data-a="signout">Sign out everywhere</button>${u.admin ? '' : '<hr><button data-a="delete" class="danger">Delete account</button>'}`;
  p.onclick = ev => { const b = ev.target.closest('[data-a]'); if (b) { closeMenus(); act(u, b.dataset.a); } };
  m.after(p); m.setAttribute('aria-expanded', 'true'); p.querySelector('button').focus();
}
const run = (u, action, extra = {}) => api('/admin/user', { method: 'POST', body: JSON.stringify({ username: u.username, action, ...extra }) });
async function act(u, a) {
  try {
    if (a === 'comp' || a === 'uncomp') { await run(u, a); u.comp = a === 'comp' ? 1 : null; u.plus = u.admin || !!u.comp || (u.plan === 'plus' && u.plan_until > Date.now()); drawUsers(); toast(a === 'comp' ? `${u.username} now has free Plus` : `Removed free Plus from ${u.username}`); }
    else if (a === 'signout') modal(`<h3>Sign ${esc(u.username)} out everywhere?</h3><p>They’ll need their password to get back in. Their games and progress stay.</p><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn gold" id="go">Sign out</button></div>`, (m, close) => m.querySelector('#go').onclick = async () => { try { await run(u, 'signout'); close(); toast(`${u.username} was signed out everywhere`); } catch (e) { toast(e.message); } });
    else if (a === 'recovery') modal(`<h3>New recovery code for ${esc(u.username)}?</h3><p>Their old code stops working. Use this when someone is locked out and you’ve confirmed it’s really them.</p><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn gold" id="go">Make code</button></div>`, (m, close) => m.querySelector('#go').onclick = async () => { try { const r = await run(u, 'recovery'); m.querySelector('.dlg').innerHTML = `<h3>Recovery code for ${esc(u.username)}</h3><p>Send it to them privately. They use it under Sign in → Forgot password.</p><div class="code">${esc(r.recoveryCode)}</div><div class="row"><button class="btn ghost" id="cp">Copy</button><button class="btn gold" data-x>Done</button></div>`; m.querySelector('#cp').onclick = () => navigator.clipboard.writeText(r.recoveryCode).then(() => toast('Copied')); } catch (e) { toast(e.message); } });
    else if (a === 'delete') modal(`<h3>Delete ${esc(u.username)}?</h3><p>This permanently deletes the account, its games, drills and progress. It can’t be undone. Type <b>${esc(u.username)}</b> to confirm.</p><input id="cf" autocomplete="off" aria-label="Type the username to confirm"><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn red" id="go" disabled>Delete for good</button></div>`, (m, close) => { const i = m.querySelector('#cf'), g = m.querySelector('#go'); i.oninput = () => g.disabled = i.value !== u.username; g.onclick = async () => { try { await run(u, 'delete', { confirm: i.value }); close(); S.users = S.users.filter(x => x !== u); S.stats.users--; drawUsers(); toast(`${u.username} was deleted`); } catch (e) { toast(e.message); } }; });
  } catch (e) { toast(e.message); }
}

/* ---------- reports ---------- */
async function reports() {
  $('#main').innerHTML = `<h1>Reports</h1><p class="sub">Players reported by other players. Open a player in Accounts to act on a report.</p><div class="card" id="rl"><div class="empty">Loading…</div></div>`;
  try {
    const rs = (await api('/admin/reports')).reports;
    const draw = () => { $('#rl').innerHTML = rs.length ? rs.map(r => `<div class="err" style="${r.done ? 'opacity:.5' : ''}"><time>${new Date(r.t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</time><div><b>${esc(r.target)}</b> · ${esc(r.reason)} <span style="color:var(--mute)">reported by ${esc(r.by_user)}</span>${r.note ? `<code>${esc(r.note)}</code>` : ''}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><a class="btn ghost" href="/u/${encodeURIComponent(r.target)}" target="_blank" style="padding:6px 12px">Profile</a><button class="btn ghost" data-acc="${esc(r.target)}" style="padding:6px 12px">Find in accounts</button>${r.done ? '' : `<button class="btn gold" data-done="${r.id}" style="padding:6px 12px">Mark handled</button>`}</div></div></div>`).join('') : '<div class="empty">No reports. Everyone’s behaving.</div>'; };
    draw();
    $('#rl').onclick = async e => { const d = e.target.closest('[data-done]'), a = e.target.closest('[data-acc]');
      if (d) { await api('/admin/report', { method: 'POST', body: JSON.stringify({ id: +d.dataset.done }) }); rs.find(r => r.id === +d.dataset.done).done = 1; draw(); toast('Marked as handled'); }
      if (a) { S.q = a.dataset.acc; show('accounts'); } };
  } catch (e) { $('#rl').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- errors ---------- */
function errors() {
  const es = S.stats.errors || [];
  $('#main').innerHTML = `<h1>Errors</h1><p class="sub">Problems players’ browsers reported, newest first. The last 1,000 are kept.</p>
  <div class="card">${es.length ? es.map(x => `<div class="err"><time>${new Date(x.t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</time><div>${esc(x.msg)}<code>${esc(x.src)} ${esc(x.path)}</code></div></div>`).join('') : '<div class="empty">No errors reported. Nice.</div>'}</div>`;
}

function show(t) { S.tab = t; [...$('#tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === t)); history.replaceState(null, '', '#' + t); ({ overview, accounts, reports, errors })[t](); }
$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) show(b.dataset.t); };
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'overview' && S.stats) overview(); }, 150); });
(async () => {
  try {
    if (!token) throw Object.assign(new Error('x'), { status: 401 });
    const me = (await api('/me')).user; if (!me.admin) throw Object.assign(new Error('x'), { status: 403 });
    $('#who').textContent = 'Signed in as ' + me.username;
    S.stats = await api('/stats'); $('#tabs').hidden = false;
    show(['overview', 'accounts', 'reports', 'errors'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
  } catch (e) {
    const signin = e.status === 401;
    $('#main').innerHTML = `<div class="gate"><img src="/icons/icon-192.png" alt=""><h1>${signin ? 'Sign in first' : 'Admins only'}</h1><p class="sub">${signin ? 'Sign in on NextMove with your admin account, then come back to this page.' : 'This page is only for NextMove admins.'}</p><a class="btn gold" href="/">Go to NextMove</a></div>`;
  }
})();
</script></body></html>
